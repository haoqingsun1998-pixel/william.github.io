<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Portal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
body{background:#111;color:#fff;padding:20px;line-height:1.6;}
.container{max-width:1100px;margin:0 auto;}
h2{margin-bottom:20px;}
.card{background:#222;padding:20px;border-radius:10px;margin-bottom:24px;}
input,textarea{width:100%;padding:12px;margin:8px 0;background:#333;border:none;color:#fff;border-radius:6px;}
button{padding:10px 18px;border:none;border-radius:6px;cursor:pointer;margin:4px;}
.btn-blue{background:#3b82f6;color:white;}
.btn-red{background:#ef4444;color:white;}
.goods-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(260px,1fr));gap:16px;}
.goods-card{background:#222;padding:16px;border-radius:10px;}
.goods-card img{width:100%;height:180px;object-fit:cover;border-radius:6px;}
.logout{float:right;background:#ef4444;}
#previewImg{max-height:160px;margin:10px 0;border-radius:6px;display:none;}
</style>
</head>
<body>
<div class="container">
  <button class="logout" onclick="logout()">Logout</button>
  <h2>Seller Portal - Add Product</h2>
  <div class="card">
    <input type="text" id="gName" placeholder="Product Name">
    <input type="file" id="imgFile" accept="image/*" onchange="previewImage()">
    <img id="previewImg">
    <input type="number" id="gPrice" placeholder="Unit Price" step="0.01">
    <textarea id="gDesc" placeholder="Product Description"></textarea>
    <button class="btn-blue" onclick="addGoods()">Add Product</button>
  </div>
  <h3>Your Listed Products</h3>
  <div class="goods-grid" id="sellerGoods"></div>
</div>

<script>
if(localStorage.getItem("isSellerLogin") !== "true"){
  window.location.href = "login.html";
}

let imageBase64 = "";

function previewImage(){
  const file = document.getElementById("imgFile").files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    imageBase64 = e.target.result;
    document.getElementById("previewImg").src = imageBase64;
    document.getElementById("previewImg").style.display = "block";
  }
  reader.readAsDataURL(file);
}

function getGoods(){
  const raw = localStorage.getItem("goods");
  return raw ? JSON.parse(raw) : [];
}
function saveGoods(list){
  localStorage.setItem("goods", JSON.stringify(list));
}

function addGoods(){
  const name = document.getElementById('gName').value.trim();
  const price = Number(document.getElementById('gPrice').value);
  const desc = document.getElementById('gDesc').value.trim();
  if(!name || !price){alert("Product name and price cannot be empty");return;}
  const goodsList = getGoods();
  goodsList.push({
    id:Date.now(),
    name,
    img:imageBase64,
    price,
    desc
  });
  saveGoods(goodsList);
  renderSellerGoods();
  // reset form
  document.getElementById('gName').value = "";
  document.getElementById('imgFile').value = "";
  document.getElementById('gPrice').value = "";
  document.getElementById('gDesc').value = "";
  imageBase64 = "";
  document.getElementById("previewImg").style.display = "none";
}

function delGoods(id){
  let list = getGoods();
  list = list.filter(item=>item.id!==id);
  saveGoods(list);
  renderSellerGoods();
}

function renderSellerGoods(){
  const wrap = document.getElementById('sellerGoods');
  const goods = getGoods();
  wrap.innerHTML = "";
  goods.forEach(g=>{
    wrap.innerHTML += `
      <div class="goods-card">
        <img src="${g.img}" alt="${g.name}">
        <h4>${g.name}</h4>
        <p>$${g.price.toFixed(2)}</p>
        <p>${g.desc}</p>
        <button class="btn-red" onclick="delGoods(${g.id})">Delete Product</button>
      </div>
    `
  })
}

function logout(){
  localStorage.removeItem("isSellerLogin");
  window.location.href = "login.html";
}

renderSellerGoods();
</script>
</body>
</html>
