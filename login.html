<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
body{background:#111;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:#222;padding:30px;border-radius:10px;width:100%;max-width:400px;}
h2{text-align:center;margin-bottom:24px;}
input{width:100%;padding:12px;margin:8px 0;background:#333;border:none;color:#fff;border-radius:6px;font-size:16px;}
button{width:100%;padding:12px;margin-top:12px;border:none;border-radius:6px;background:#3b82f6;color:#fff;font-size:16px;cursor:pointer;}
.link-box{margin-top:20px;text-align:center;}
a{color:#3b82f6;text-decoration:none;}
</style>
</head>
<body>
<div class="login-card">
  <h2>Seller Login</h2>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Sign In</button>
  <div class="link-box">
    <p>Buyer? <a href="buyer.html">Go to Buyer Page</a></p>
  </div>
</div>

<script>
const SELLER_USER = "seller";
const SELLER_PASS = "123456";

function login(){
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value.trim();
  if(user === SELLER_USER && pass === SELLER_PASS){
    localStorage.setItem("isSellerLogin", "true");
    window.location.href = "seller.html";
  }else{
    alert("Wrong username or password");
  }
}
</script>
</body>
</html>
